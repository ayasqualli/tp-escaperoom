<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrong Answer</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .screen {
        text-align: center;
        padding: 32px;
        max-width: 600px;
      }
      span {
        height: 2em;
        vertical-align: middle;
      }

      .image-box img {
        display: block;
        border-radius: 16px;
        margin: 5px;
        height: 550px;
        width: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      span:hover {
        color: rgba(255, 0, 0, 0.5);
        font-size: 100px;
      }

      p {
        margin: 0;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .button {
        display: block;
        width: min(80%, 340px);
        margin: 18px auto;
        padding: 16px 20px;
        background-color: #5b09e0;
        color: #f2f1f1;
        text-decoration: none;
        border-radius: 10px;
        font-weight: 700;
        font-size: 30px;
        transition:
          transform 0.2s ease,
          background-color 0.2s ease,
          box-shadow 0.2s ease;
        box-shadow: 0 6px 18px rgba(255, 255, 255, 0.08);
      }

      .button:hover {
        background-color: #9569dc;
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(255, 255, 255, 0.12);
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="image-box">
        <img src="/assets/wrong2.jpeg" height="100%" margin="5px" />
      </div>
      <h1><span>Wrong!</span></h1>
      <p>Wrong answer, try harder</p>
      <a class="button" href="room2.html">Try again</a>
    </div>
  </body>
</html>
