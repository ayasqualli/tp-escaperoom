<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrong Answer</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f9fafb;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }

      .screen {
        text-align: center;
        padding: 32px;
        max-width: 600px;
      }
      span {
        height: 2em;
        vertical-align: middle;
      }

      .image-box img {
        display: block;
        border-radius: 16px;
        margin: 5px;
        height: 550px;
        width: 600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      span:hover {
        color: rgba(255, 0, 0, 0.5);
        font-size: 100px;
      }

      p {
        margin: 0;
        font-size: 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <div class="image-box">
        <img src="/assets/wrong2.jpeg" height="100%" margin="5px" />
      </div>
      <h1><span>Wrong!</span></h1>
      <p>Wrong answer, try harder</p>
    </div>
  </body>
</html>
